<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F2F4F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="토스 송금">
<title>토스 송금</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F2F4F6; --card:#FFFFFF; --primary:#3182F6; --primary-strong:#1B64DA; --primary-weak:#E8F3FF;
  --text:#191F28; --text-2:#4E5968; --text-3:#8B95A1; --text-4:#B0B8C1;
  --line:#E5E8EB; --disabled:#E5E8EB; --disabled-text:#B0B8C1; --fill:#F2F4F6;
  --red:#F04452; --red-weak:#FFEEF0; --up:#F04452; --down:#3182F6; --green:#03B26C;
  --nav-h:60px; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1); --dur:240ms;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  background:#E9ECEF;color:var(--text);-webkit-font-smoothing:antialiased;word-break:keep-all;
  overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;line-height:1.45;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{font:inherit;color:inherit;border:0;outline:0;background:none;min-width:0}
input::placeholder{color:var(--text-4)}
input[type=search]::-webkit-search-cancel-button{display:none}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

#app{position:relative;width:100%;max-width:460px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;isolation:isolate}
@media (min-width:461px){#app{box-shadow:0 0 0 1px rgba(0,0,0,.03),0 10px 40px rgba(0,0,0,.06)}}

/* ---------- Stack screens ---------- */
#stack{position:absolute;inset:0;z-index:20;pointer-events:none}
.screen{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;pointer-events:auto;overflow:hidden;transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease);will-change:transform}
.screen.white{background:#fff}
.screen.offright{transform:translateX(100%)}
.screen.under{transform:translateX(-22%)}
.screen.fade-enter{opacity:0;transform:translateY(10px)}
.screen.fade-out{opacity:0}
.screen-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

.appbar{flex:none;height:calc(54px + var(--safe-t));padding:var(--safe-t) 8px 0;display:flex;align-items:center;gap:2px;position:relative;z-index:2}
.appbar .title{flex:1;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.appbar .spacer{flex:1}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;color:var(--text);transition:background .15s,transform .12s}
.icon-btn:active{background:rgba(2,32,71,.05);transform:scale(.94)}
.icon-btn svg{width:24px;height:24px}
.icon-btn.sm svg{width:20px;height:20px}
.text-btn{font-size:15px;font-weight:600;color:var(--text-2);padding:8px 10px;border-radius:10px}
.text-btn:active{background:var(--fill)}
.text-btn.blue{color:var(--primary)}

.bottom-cta{flex:none;padding:12px 20px calc(12px + var(--safe-b));background:inherit;position:relative}
.bottom-cta::before{content:"";position:absolute;left:0;right:0;top:-20px;height:20px;background:linear-gradient(to bottom,transparent,var(--cta-fade,var(--bg)));pointer-events:none}
.screen.white .bottom-cta{--cta-fade:#fff}

/* ---------- Buttons ---------- */
.btn{height:56px;border-radius:16px;font-size:17px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s var(--ease),background-color .15s,color .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{background:var(--primary-strong)}
.btn-primary.disabled,.btn-primary:disabled{background:var(--disabled);color:var(--disabled-text)}
.btn-primary.disabled:active{transform:none}
.btn-secondary{background:var(--primary-weak);color:var(--primary-strong)}
.btn-secondary:active{background:#D6E8FF}
.btn-gray{background:var(--fill);color:var(--text-2)}
.btn-gray:active{background:#E5E8EB}
.btn-danger{background:var(--red);color:#fff}
.btn-md{height:48px;font-size:16px;border-radius:14px}
.btn-sm{height:38px;font-size:14px;border-radius:10px;width:auto;padding:0 14px}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}
.mini-btn{flex:none;height:34px;padding:0 13px;border-radius:9px;background:var(--fill);color:var(--text-2);font-size:14px;font-weight:600;transition:transform .12s,background .15s}
.mini-btn:active{transform:scale(.95);background:#E5E8EB}
.mini-btn.blue{background:var(--primary-weak);color:var(--primary-strong)}
.tap{transition:transform .14s var(--ease),background-color .15s}
.tap:active{transform:scale(.975)}
.row-tap{transition:background-color .15s}
.row-tap:active{background:#F9FAFB}
.card .row-tap:active,.sheet .row-tap:active{background:#F4F6F8}

/* ---------- Common ---------- */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);height:calc(56px + var(--safe-t));padding:var(--safe-t) 10px 0 20px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.03em}
.brand .logo{width:26px;height:26px;flex:none}
.top-actions{display:flex;align-items:center}
.top-actions .icon-btn{color:#4E5968;width:40px}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.02em;flex:1}
.card{background:var(--card);border-radius:20px;margin:0 12px 12px;padding:22px 20px}
.card.flush{padding:8px 0}
.card-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:6px;letter-spacing:-.02em}
.card-title .more{margin-left:auto;font-size:14px;font-weight:500;color:var(--text-3);display:flex;align-items:center}
.card-title .more svg{width:16px;height:16px}
.muted{color:var(--text-3)}
.small{font-size:13px}
.h1{font-size:24px;font-weight:700;line-height:1.4;letter-spacing:-.025em}
.page-head{padding:8px 24px 20px}
.page-head .sub{font-size:15px;color:var(--text-3);margin-top:6px}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;color:var(--text-2);background:var(--fill);border-radius:5px;padding:2px 6px;vertical-align:middle;white-space:nowrap;line-height:1.4}
.tag.blue{color:var(--primary-strong);background:var(--primary-weak)}
.tag.red{color:var(--red);background:var(--red-weak)}
.divider{height:1px;background:var(--line)}
.sep{height:12px}
.sim-banner{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--primary-weak);color:var(--primary-strong);font-size:13px;font-weight:600;padding:9px 16px;text-align:center;flex:none}
.sim-banner svg{width:16px;height:16px;flex:none}
.notice{display:flex;gap:8px;font-size:13px;color:var(--text-3);line-height:1.55;padding:0 24px}
.notice svg{width:16px;height:16px;flex:none;margin-top:2px}
.foot-note{font-size:12px;color:var(--text-4);text-align:center;padding:20px 24px 8px;line-height:1.6}

.bank-ic{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;letter-spacing:-.04em;overflow:hidden}
.bank-ic.sm{width:32px;height:32px;font-size:10.5px}
.bank-ic.lg{width:44px;height:44px;font-size:13px}
.bank-ic.empty{background:var(--fill);color:var(--text-4)}
.bank-ic.empty svg{width:20px;height:20px}
.ic-circle{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none}
.ic-circle svg{width:22px;height:22px}

.list-row{display:flex;align-items:center;gap:14px;padding:12px 20px;min-height:68px;width:100%;text-align:left}
.lr-main{flex:1;min-width:0}
.lr-title{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr-sub{font-size:13px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.lr-right{text-align:right;flex:none}
.lr-right .v{font-size:15px;font-weight:600}
.chev{color:var(--text-4);flex:none}
.chev svg{width:18px;height:18px}
.star-btn{color:#D1D6DB}
.star-btn.on{color:#FFC342}
.star-btn.on svg{fill:currentColor}

.empty-state{text-align:center;padding:36px 24px 40px;color:var(--text-3);font-size:15px}
.empty-state .ei{width:56px;height:56px;border-radius:50%;background:var(--fill);display:grid;place-items:center;margin:0 auto 14px;color:var(--text-4)}
.empty-state .ei svg{width:26px;height:26px}
.empty-state b{display:block;color:var(--text-2);font-size:16px;font-weight:600;margin-bottom:4px}

.info-list{display:flex;flex-direction:column}
.info-row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;font-size:15px}
.info-row dt{flex:none;width:92px;color:var(--text-3)}
.info-row dd{flex:1;min-width:0;text-align:right;font-weight:500;overflow-wrap:anywhere;word-break:break-all}
.info-row dd .tag{margin-left:4px}
.info-row .edit-link{flex:none;font-size:14px;font-weight:600;color:var(--primary);padding:0 2px 0 6px;margin:-6px -6px -6px 0;height:32px;border-radius:8px}
.info-row .edit-link:active{background:var(--primary-weak)}
.info-row.total dd{font-weight:700;color:var(--primary-strong)}

/* ---------- Transfer: recipient ---------- */
.seg{display:flex;margin:0 20px 16px;background:var(--fill);border-radius:12px;padding:4px}
.screen.white .seg{background:#F2F4F6}
.seg-item{flex:1;height:38px;border-radius:9px;font-size:15px;font-weight:600;color:var(--text-3);transition:background .18s,color .18s,box-shadow .18s}
.seg-item.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.form-card{margin:0 20px;border-radius:18px;background:#F9FAFB;border:1px solid #F2F4F6}
.bank-field{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left;border-radius:18px 18px 0 0}
.bank-field .bf-name{flex:1;font-size:17px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bank-field .bf-ph{flex:1;font-size:17px;color:var(--text-4);font-weight:500}
.form-card .divider{margin:0 16px}
.acct-field{display:flex;align-items:center;gap:8px;padding:14px 12px 4px 16px}
.acct-input{flex:1;font-size:20px;font-weight:600;letter-spacing:.01em;height:40px;font-variant-numeric:tabular-nums}
.acct-input::placeholder{font-weight:500;font-size:18px;letter-spacing:-.01em}
.clear-btn{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;background:#C9CED4}
.clear-btn svg{width:14px;height:14px}
.clear-btn:active{background:#B0B8C1}
.field-msg{min-height:18px;font-size:13px;color:var(--red);padding:2px 16px 0;transition:opacity .15s}
.field-msg.info{color:var(--text-3)}
.name-line{display:flex;align-items:center;gap:8px;padding:6px 10px 12px 16px;min-height:48px}
.name-status{flex:1;min-width:0;font-size:14px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name-status b{font-weight:700;color:var(--text)}
.name-btn{flex:none;display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 11px;border-radius:10px;background:var(--primary-weak);color:var(--primary-strong);font-size:13px;font-weight:700;transition:transform .12s,background .15s}
.name-btn svg{width:14px;height:14px}
.name-btn:active{transform:scale(.95);background:#D6E8FF}
.name-btn.attn{animation:attn .5s var(--ease)}
.hint{font-size:13px;color:var(--text-3);padding:10px 24px 0;line-height:1.5}
.ls{margin-top:28px}
.ls-title{font-size:15px;font-weight:600;color:var(--text-2);padding:0 24px 4px;display:flex;align-items:center;gap:6px}
.ls .list-row{padding:10px 12px 10px 24px}
.lr-sub2{font-size:12px;color:var(--text-4);margin-top:1px}

/* ---------- Bank sheet ---------- */
.search-box{display:flex;align-items:center;gap:8px;height:48px;border-radius:14px;background:var(--fill);padding:0 12px;margin-bottom:12px}
.search-box svg{width:20px;height:20px;color:var(--text-4);flex:none}
.search-box input{flex:1;font-size:16px;height:100%}
.sticky-top{position:sticky;top:0;background:#fff;z-index:2;padding-top:4px}
.bank-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:8px}
.bank-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 4px 12px;border-radius:16px;background:#F9FAFB;font-size:13px;font-weight:500;color:var(--text-2);min-height:92px;text-align:center;letter-spacing:-.03em;line-height:1.3}
.bank-tile:active{background:#F2F4F6}
.bank-tile.on{background:var(--primary-weak);color:var(--primary-strong);font-weight:700}
.empty-mini{text-align:center;color:var(--text-3);font-size:15px;padding:40px 0}

/* ---------- Sheets ---------- */
#sheetLayer{position:absolute;inset:0;z-index:50;pointer-events:none}
.sheet-wrap{position:absolute;inset:0;pointer-events:auto}
.sheet-dim{position:absolute;inset:0;background:rgba(0,12,30,.48);opacity:0;transition:opacity .26s var(--ease)}
.sheet{position:absolute;left:0;right:0;bottom:var(--kb,0px);background:#fff;border-radius:24px 24px 0 0;padding:6px 0 calc(14px + var(--safe-b));transform:translateY(105%);transition:transform .28s var(--ease),bottom .2s;max-height:calc(100% - 40px - var(--safe-t));display:flex;flex-direction:column}
.sheet.tall{height:calc(100% - 40px - var(--safe-t))}
.sheet-wrap.open .sheet-dim{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.grabber{width:36px;height:4px;border-radius:2px;background:#E5E8EB;margin:4px auto 6px;flex:none}
.sheet-head{padding:14px 24px 6px;flex:none}
.sheet-title{font-size:20px;font-weight:700;line-height:1.4;letter-spacing:-.02em}
.sheet-sub{font-size:15px;color:var(--text-3);margin-top:4px;line-height:1.5}
.sheet-body{flex:1;overflow-y:auto;padding:12px 24px 4px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-body.flush{padding-left:0;padding-right:0}
.sheet-foot{padding:12px 20px 0;flex:none}
.input-box{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--line);padding:6px 0;transition:border-color .15s}
.input-box:focus-within{border-color:var(--primary)}
.input-box input{flex:1;font-size:22px;font-weight:600;height:44px}
.input-meta{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;min-height:18px;color:var(--text-3)}
.input-meta .err{color:var(--red)}
.opt-row{display:flex;align-items:center;gap:12px;width:100%;padding:16px 24px;font-size:17px;font-weight:500;text-align:left}
.opt-row svg{width:22px;height:22px;color:var(--text-3)}
.opt-row.danger{color:var(--red)}
.opt-row.danger svg{color:var(--red)}

/* ---------- Amount ---------- */
.amt-top{padding:4px 24px 0;flex:none}
.to-line{display:flex;align-items:center;gap:10px}
.to-name{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.to-sub{font-size:13px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt-top .h1{margin-top:18px;font-size:22px}
.amt-display{flex:1;display:flex;flex-direction:column;justify-content:center;padding:4px 24px;min-height:96px}
.amt-value{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s}
.amt-value.zero{color:#C9CED4}
.amt-value.long{font-size:32px}
.amt-value.bump{animation:bump .18s var(--ease)}
.amt-value.err{color:var(--red)}
.amt-value.shake{animation:shake .32s}
.amt-sub{font-size:14px;color:var(--text-3);margin-top:6px;min-height:20px}
.amt-sub.err{color:var(--red);font-weight:500}
.source-row{display:flex;align-items:center;gap:10px;margin:0 16px;padding:12px 14px;border-radius:14px;background:#F9FAFB;text-align:left;flex:none}
.source-row .s-main{flex:1;min-width:0;font-size:14px;color:var(--text-2)}
.source-row .s-main b{color:var(--text);font-weight:600}
.quick-row{display:flex;gap:6px;padding:12px 16px 4px;flex:none;overflow-x:auto;scrollbar-width:none}
.quick-row::-webkit-scrollbar{display:none}
.chip{flex:1 0 auto;height:36px;padding:0 12px;border-radius:10px;background:var(--fill);font-size:14px;font-weight:600;color:var(--text-2);white-space:nowrap;transition:transform .12s,background .15s}
.chip:active{transform:scale(.94);background:#E5E8EB}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);padding:4px 12px 0;flex:none}
.key{height:clamp(44px,7.4dvh,62px);font-size:24px;font-weight:600;border-radius:16px;display:grid;place-items:center;color:var(--text);transition:background .1s,transform .1s;font-variant-numeric:tabular-nums}
.key:active{background:var(--fill);transform:scale(.92)}
.key svg{width:28px;height:28px}

/* ---------- Confirm sheet ---------- */
.sheet-title b{font-weight:800}
.confirm-mini{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.confirm-mini .info-row{font-size:15px;padding:9px 0}
.sim-line{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0 2px;padding:9px 12px;border-radius:10px;background:var(--primary-weak);color:var(--primary-strong);font-size:13px;font-weight:600}
.sim-line svg{width:15px;height:15px;flex:none}

/* ---------- Processing / Complete ---------- */
.proc-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px 80px;text-align:center}
.send-stage{position:relative;width:100%;max-width:300px;aspect-ratio:2/1;margin-bottom:18px}
.send-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.send-track{fill:none;stroke:#E5E8EB;stroke-width:3;stroke-linecap:round;stroke-dasharray:2 7}
.send-progress{fill:none;stroke:var(--primary);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.35s cubic-bezier(.45,0,.2,1)}
.send-stage.go .send-progress{stroke-dashoffset:0}
.send-plane{opacity:0;transition:opacity .2s}
.send-stage.go .send-plane{opacity:1}
.send-stage.arrived .send-plane{opacity:0}
.send-node{position:absolute;top:66.67%;width:96px;margin-left:-48px;margin-top:-22px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text-2);animation:fadeUp .35s var(--ease) both}
.send-node span:last-child{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.send-node.from{left:16.67%}
.send-node.to{left:83.33%;animation-delay:.08s}
.send-node .to-ic{width:44px;height:44px;display:grid;place-items:center}
.send-stage.arrived .send-node.to{color:var(--primary-strong)}
.arrive-check{width:44px;height:44px;animation:pop .42s cubic-bezier(.3,1.5,.5,1)}
.send-amount{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:18px 0 4px;min-height:44px}
.proc-title{transition:opacity .18s}
.proc-title.fade{opacity:0}
.check-path{stroke-dasharray:44;stroke-dashoffset:44;animation:draw .36s .12s var(--ease) forwards}
.proc-title{font-size:24px;font-weight:700;line-height:1.45;letter-spacing:-.025em;overflow-wrap:anywhere}
.proc-msg{font-size:17px;color:var(--text-2);margin-top:6px;font-weight:500;transition:opacity .2s}
.proc-msg.fade{opacity:0}
.proc-note{font-size:13px;color:var(--text-3);margin-top:20px}
.complete-body{background-repeat:repeat;background-size:220px 140px}
.done-hero{text-align:center;padding:28px 24px 20px}
.done-ic{width:72px;height:72px;margin:0 auto 22px;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.done-hero h1{font-size:24px;font-weight:700;line-height:1.45;letter-spacing:-.025em;overflow-wrap:anywhere}
.done-hero .sim-strong{display:inline-flex;align-items:center;gap:6px;margin-top:16px;background:var(--primary-weak);color:var(--primary-strong);font-size:14px;font-weight:700;border-radius:10px;padding:8px 12px}
.done-hero .sim-strong svg{width:16px;height:16px}
.receipt{margin:8px 20px 0;padding:6px 18px;border-radius:18px;background:rgba(249,250,251,.92);border:1px solid #F2F4F6}
.receipt .info-row{font-size:14px;padding:10px 0}
.receipt .info-row dt{width:84px}
.fav-line{display:flex;justify-content:center;margin:14px 0 4px}
.fav-line button{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--text-2);padding:8px 12px;border-radius:10px}
.fav-line button:active{background:var(--fill)}
.fav-line svg{width:18px;height:18px}
.fav-line .on svg{color:#FFC342;fill:#FFC342}
.done-actions{display:flex;flex-direction:column;gap:8px}

/* ---------- Toast ---------- */
#toast{position:absolute;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);transform:translate(-50%,12px);background:rgba(25,31,40,.94);color:#fff;font-size:15px;font-weight:500;padding:12px 18px;border-radius:14px;max-width:calc(100% - 40px);width:max-content;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);z-index:100;line-height:1.45}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.high{bottom:calc(var(--safe-b) + 96px)}
#toast.top{top:calc(var(--safe-t) + 16px);bottom:auto;transform:translate(-50%,-12px)}
#toast.top.show{transform:translate(-50%,0)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes bump{50%{transform:scale(1.03)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes attn{30%{transform:scale(1.08)}60%{transform:scale(.97)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growY{from{transform:scaleY(0)}}
.fade-up{animation:fadeUp .32s var(--ease) both}
@media (max-width:360px){
  .h1{font-size:21px}.amt-value{font-size:34px}.amt-value.long{font-size:27px}
  .svc-grid{grid-template-columns:repeat(4,1fr)}
  .card{padding:20px 16px}.acc-row,.list-row{padding-left:16px;padding-right:16px}
  .confirm-hero h1,.done-hero h1,.proc-title{font-size:21px}
  .info-row dt{width:80px}
}
@media (max-height:640px){.amt-top .h1{margin-top:10px;font-size:20px}.amt-display{min-height:72px}.amt-value{font-size:34px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Bank logos and motion */
.bank-ic.bank-logo{background:transparent;overflow:hidden}
.bank-logo img{display:block;width:100%;height:100%;object-fit:contain;border-radius:50%}
.amount-character{display:inline-block;white-space:pre;vertical-align:baseline;will-change:transform,opacity}
.amount-character.changed{animation:amountDigitIn .28s var(--ease) var(--digit-delay,0ms) both}
.sheet{transform:translate3d(0,calc(100% + 36px),0);transition:transform .42s cubic-bezier(.22,1,.36,1),bottom .2s;will-change:transform}
.sheet-wrap.open .sheet{transform:translate3d(0,0,0)}
.sheet-dim{transition:opacity .32s ease}
.screen.offright{transform:translate3d(100%,0,0)}
.screen{transition:transform .34s cubic-bezier(.22,1,.36,1),opacity .28s ease}
.proc-wrap{padding:0 24px 80px}
.wave-dots{display:flex;align-items:center;justify-content:center;gap:11px;height:60px;margin:0 0 25px}
.wave-dots span{display:block;width:15px;height:15px;background:#3182F6;border-radius:50%;animation:dotWave 1.05s ease-in-out infinite;will-change:transform}
.wave-dots span:nth-child(2){animation-delay:.14s}
.wave-dots span:nth-child(3){animation-delay:.28s}
.complete-body{display:flex;align-items:center;justify-content:center;padding-bottom:48px}
.done-hero{width:100%;padding:24px;animation:completeAppear .48s cubic-bezier(.22,1,.36,1) both}
.done-hero h1{font-size:28px;line-height:1.5;font-weight:700;letter-spacing:-.035em}
.done-hero h1 b{font-weight:800}
@keyframes amountDigitIn{from{transform:translateY(13px);opacity:.15;filter:blur(1px)}to{transform:translateY(0);opacity:1;filter:blur(0)}}
@keyframes dotWave{0%,60%,100%{transform:translateY(7px)}30%{transform:translateY(-11px)}}
@keyframes completeAppear{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:360px){.done-hero h1{font-size:25px}}
@media(prefers-reduced-motion:reduce){.wave-dots span{animation:none;opacity:.7}.amount-character.changed,.done-hero{animation:none}.sheet,.screen,.sheet-dim{transition-duration:.01ms}}

</style>

function saveAppState() {

function sanitizeLoaded(d) {
  const base = defaultState();
  if (!d || typeof d !== 'object' || d.version !== 1) throw new Error('version');
  if (!Array.isArray(d.accounts) || !d.accounts.length) throw new Error('accounts');
  const accounts = d.accounts.map(a => {
    if (!a || typeof a.id !== 'string' || !isMoney(a.balance)) throw new Error('account');
    const def = base.accounts.find(b => b.id === a.id);
    if (!def) throw new Error('unknown account');
    return { ...def, balance: a.balance, nickname: typeof a.nickname === 'string' && a.nickname ? a.nickname.slice(0, 20) : def.nickname };
  });
  if (!Array.isArray(d.transactions)) throw new Error('transactions');
  const transactions = d.transactions.filter(t => t && typeof t.id === 'string' && isMoney(t.amount) && isMoney(t.balanceAfter) && Number.isFinite(t.createdAt) && accounts.some(a => a.id === t.accountId))
    .map(t => ({ ...t, recipientName: String(t.recipientName || '').slice(0, MAX_NAME), recipientAccount: String(t.recipientAccount || '').replace(/\D/g, '').slice(0, ACCT_MAX) }));
  const recipients = (Array.isArray(d.recipients) ? d.recipients : []).filter(r => r && bankById(r.bankId) && /^\d{6,20}$/.test(String(r.account)) && typeof r.name === 'string' && r.name.trim())
    .map(r => ({ key: `${r.bankId}:${r.account}`, bankId: r.bankId, account: String(r.account), name: r.name.slice(0, MAX_NAME), nameSource: 'manual', lastAt: Number(r.lastAt) || Date.now(), count: Number(r.count) || 1, favorite: !!r.favorite }));
  const processedTxIds = [...new Set([...(Array.isArray(d.processedTxIds) ? d.processedTxIds.filter(x => typeof x === 'string') : []), ...transactions.map(t => t.id)])];
  const s = d.settings && typeof d.settings === 'object' ? d.settings : {};
  const settings = { ...base.settings };
  for (const k of Object.keys(settings)) if (s[k] !== undefined && typeof s[k] === typeof settings[k] && Array.isArray(s[k]) === Array.isArray(settings[k])) settings[k] = s[k];
  if (!isMoney(settings.points)) settings.points = base.settings.points;
  const tr = d.transfer && typeof d.transfer === 'object' ? d.transfer : {};
  const transfer = emptyTransfer(accounts.some(a => a.id === tr.sourceAccountId) ? tr.sourceAccountId : 'acc_living');
  if (bankById(tr.recipientBank) && tr.recipientBank !== 'moa') transfer.recipientBank = tr.recipientBank;
  if (typeof tr.recipientAccount === 'string') transfer.recipientAccount = tr.recipientAccount.replace(/\D/g, '').slice(0, ACCT_MAX);
  if (typeof tr.recipientName === 'string') transfer.recipientName = tr.recipientName.slice(0, MAX_NAME);
  if (isMoney(tr.amount) && tr.amount <= MAX_AMOUNT) transfer.amount = tr.amount;
  // 앱은 항상 홈에서 시작하므로 진행 중이던 단계는 idle로 되돌린다(잔액은 완료 시점에만 바뀌므로 안전).
  if (tr.status === 'completed' || (typeof tr.txId === 'string' && processedTxIds.includes(tr.txId))) return { version: 1, accounts, transactions, recipients, processedTxIds, settings, transfer: emptyTransfer(transfer.sourceAccountId) };
  return { version: 1, accounts, transactions, recipients, processedTxIds, settings, transfer };
}
function loadAppState() {
  let raw = null;

function setTransferStatus(next) {
  const t = appState.transfer;
  if (t.status === next) return true;
  if (!(TRANSITIONS[t.status] || []).includes(next)) {
    console.warn(`[토스] 허용되지 않은 송금 상태 전환: ${t.status} → ${next}`);
    return false;
  }
  t.status = next;
  return true;
}
function resetTransfer() {

function sanitizeAccount(raw) {
  let s = String(raw || '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  s = s.replace(/[\s\-–—.·_/]/g, '');
  const hadInvalid = /\D/.test(s);
  let digits = s.replace(/\D/g, '');
  const tooLong = digits.length > ACCT_MAX;
  if (tooLong) digits = digits.slice(0, ACCT_MAX);
  return { digits, hadInvalid, tooLong };
}
function setRecipientAccount(digits) { appState.transfer.recipientAccount = digits; saveAppState(); }
function normalizeName(v) { return String(v || '').replace(/[\u0000-\u001F\u007F]/g, '').replace(/\s+/g, ' ').trim().slice(0, MAX_NAME); }
function setRecipientName(v) {
  appState.transfer.recipientName = normalizeName(v);
  appState.transfer.recipientNameSource = 'manual';

}
function selectBank(id) {

function setTransferAmount(n) {
  n = Math.floor(Number(n) || 0);
  appState.transfer.amount = Math.max(0, Math.min(MAX_AMOUNT, n));
  saveAppState();
}
function validateTransfer(stage = 'all') {
  const t = appState.transfer;
  if (!bankById(t.recipientBank) || t.recipientBank === 'moa') return { ok: false, field: 'bank', message: '받는 은행을 선택해주세요' };
  if (!t.recipientAccount) return { ok: false, field: 'account', message: '계좌번호를 입력해주세요' };
  if (!/^\d+$/.test(t.recipientAccount)) return { ok: false, field: 'account', message: '계좌번호는 숫자만 입력할 수 있어요' };
  if (t.recipientAccount.length < ACCT_MIN || t.recipientAccount.length > ACCT_MAX) return { ok: false, field: 'account', message: `계좌번호를 다시 확인해주세요 (${ACCT_MIN}~${ACCT_MAX}자리 숫자)` };
  if (!normalizeName(t.recipientName)) return { ok: false, field: 'name', message: '받는 사람 이름을 입력해주세요' };
  if (stage === 'recipient') return { ok: true };
  const acc = getAccount(t.sourceAccountId);
  if (!acc) return { ok: false, field: 'source', message: '출금 계좌를 선택해주세요' };
  if (!Number.isSafeInteger(t.amount) || t.amount <= 0) return { ok: false, field: 'amount', message: '보낼 금액을 입력해주세요' };
  if (t.amount > acc.balance) return { ok: false, field: 'amount', message: `잔액이 부족해요 · 최대 ${won(acc.balance)}` };
  return { ok: true };
}

const sheets = [];
function openSheet({ title = '', sub = '', body = '', foot = '', tall = false, flush = false, onMount, onClose, dismissible = true } = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet-dim"></div>
    <div class="sheet ${tall ? 'tall' : ''}" role="dialog" aria-modal="true" ${title ? `aria-label="${esc(title.replace(/<[^>]+>/g, ''))}"` : ''}>
      <div class="grabber"></div>
      ${title ? `<div class="sheet-head"><h2 class="sheet-title">${title}</h2>${sub ? `<p class="sheet-sub">${sub}</p>` : ''}</div>` : ''}
      <div class="sheet-body ${flush ? 'flush' : ''}">${body}</div>
      ${foot ? `<div class="sheet-foot">${foot}</div>` : ''}
    </div>`;
  $('#sheetLayer').appendChild(wrap);
  const api = {
    el: wrap, closed: false, dismissible,
    close(reason = 'cancel') {
      if (api.closed) return;
      api.closed = true;
      wrap.classList.remove('open');
      wrap.style.pointerEvents = 'none';
      const i = sheets.indexOf(api);
      if (i >= 0) sheets.splice(i, 1);
      setTimeout(() => wrap.remove(), 430);
      if (document.activeElement && wrap.contains(document.activeElement)) document.activeElement.blur();
      onClose && onClose(reason);
    },
  };
  wrap.querySelector('.sheet-dim').addEventListener('click', () => { if (api.dismissible) api.close('dim'); });
  sheets.push(api);
  wrap.getBoundingClientRect();
  requestAnimationFrame(() => {
    requestAnimationFrame(() => { if (!api.closed) wrap.classList.add('open'); });
  });
  onMount && onMount(wrap.querySelector('.sheet'), api);
  return api;
}
const sheetOf = el => sheets.find(s => s.el === el.closest('.sheet-wrap'));
function infoSheet(title, msg, btn = '확인') {

const stack = [];
let navLock = false;
const ANIM = 340;
function lockNav(ms = ANIM + 30) { navLock = true; clearTimeout(lockNav.t); lockNav.t = setTimeout(() => (navLock = false), ms); }
function appbar({ title = '토스', back = true, close = false, right = '' } = {}) {
  return `<header class="appbar">
    ${back ? `<button class="icon-btn" data-act="back" aria-label="뒤로 가기">${ICON.back}</button>` : close ? `<button class="icon-btn" data-act="closeFlow" aria-label="닫기">${ICON.close}</button>` : '<span style="width:12px"></span>'}
    <div class="title">${title}</div>${right}<span style="width:8px"></span>
  </header>`;

function buildScreen(name, params = {}) {
  const def = SCREENS[name];
  const el = document.createElement('section');
  el.className = 'screen' + (def.white ? ' white' : '');
  el.dataset.screen = name;
  const entry = { name, params: { ...params }, el, def };
  paint(entry, false);
  return entry;
}
function paint(entry, keepScroll = true) {
  const oldBody = entry.el.querySelector('.screen-body');
  const st = oldBody ? oldBody.scrollTop : 0;
  entry.el.innerHTML = entry.def.render(entry);
  const nb = entry.el.querySelector('.screen-body');
  if (nb && keepScroll) nb.scrollTop = st;
  entry.def.mount && entry.def.mount(entry);
}
function repaintTop(name) { const top = stack[stack.length - 1]; if (top && (!name || top.name === name)) paint(top); }
function navigateTo(name, params = {}, opts = {}) {
  if (navLock && !opts.force) return false;
  const def = SCREENS[name];
  if (!def) return false;
  if (def.status && !setTransferStatus(def.status)) return false;
  lockNav();
  const entry = buildScreen(name, params);
  const prev = stack[stack.length - 1];
  const stackEl = $('#stack');
  if (opts.replaceAll) {
    entry.el.classList.add('fade-enter');
    stackEl.appendChild(entry.el);
    entry.el.getBoundingClientRect();
    entry.el.classList.remove('fade-enter');
    const old = stack.splice(0);
    old.forEach(o => (o.el.inert = true));
    setTimeout(() => old.forEach(o => o.el.remove()), ANIM);
  } else {
    entry.el.classList.add('offright');
    stackEl.appendChild(entry.el);
    entry.el.getBoundingClientRect();
    entry.el.classList.remove('offright');
    if (prev) { prev.el.classList.add('under'); prev.el.inert = true; }
  }
  stack.push(entry);
  syncCurrent();
  saveAppState();
  def.onEnter && def.onEnter(entry);
  return true;
}
function popScreen() {
  lockNav();
  const top = stack.pop();
  top.el.inert = true;
  top.el.classList.add('offright');
  setTimeout(() => top.el.remove(), ANIM + 20);
  top.def.onLeave && top.def.onLeave(top);
  const prev = stack[stack.length - 1];
  if (prev.def.status) setTransferStatus(prev.def.status);
  prev.el.classList.remove('under');
  prev.el.inert = false;
  paint(prev);
  saveAppState();
  syncCurrent();
}
function goBack() {
  if (sheets.length) { const s = sheets[sheets.length - 1]; if (s.dismissible) s.close('back'); return; }
  if (navLock) return;
  const top = stack[stack.length - 1];
  if (!top) return;
  if (top.def.noBack) { top.def.onBackBlocked && top.def.onBackBlocked(top); return; }
  if (stack.length <= 1) return; // 송금 시작 화면이 앱의 첫 화면
  popScreen();
}
function syncCurrent() {
  const top = stack[stack.length - 1];
  appState.currentScreen = top ? top.name : 'recipient';
}

/* ---------- 금액 화면 로직 ---------- */
function updateAmountUI(e, animate = true) {
  const el = e.el, t = appState.transfer, acc = getAccount(t.sourceAccountId);
  const val = el.querySelector('#amtValue'), sub = el.querySelector('#amtSub'), next = el.querySelector('#amtNext');
  if (!val) return;
  const over = acc && t.amount > acc.balance;
  const txt = won(t.amount);
  const previous = val.dataset.amountText || val.textContent;
  val.dataset.amountText = txt;
  val.innerHTML = Array.from(txt).map((char, i) => {
    const oldChar = previous[previous.length - (txt.length - i)];
    const changed = animate && char !== oldChar;
    return `<span class="amount-character${changed ? ' changed' : ''}" style="--digit-delay:${Math.min(i * 12, 84)}ms">${esc(char)}</span>`;
  }).join('');
  val.classList.toggle('zero', t.amount === 0);
  val.classList.toggle('long', txt.length > 12);
  const wasErr = val.classList.contains('err');
  val.classList.toggle('err', !!over);
  if (over) {
    sub.className = 'amt-sub err';
    sub.textContent = `잔액이 부족해요 · 최대 ${won(acc.balance)}까지 보낼 수 있어요`;
    if (!wasErr) { val.classList.remove('shake'); void val.offsetWidth; val.classList.add('shake'); }
  } else {
    sub.className = 'amt-sub';
    sub.textContent = t.amount ? koreanAmount(t.amount) : `잔액 ${acc ? won(acc.balance) : '-'}`;

  }
  next.classList.toggle('disabled', !validateTransfer('amount').ok);
}
function pressKey(k, e) {
  const cur = appState.transfer.amount;
  let next = cur;
  if (k === 'del') next = Math.floor(cur / 10);
  else if (k === '00') { if (!cur) return; next = cur * 100; }
  else { next = cur * 10 + Number(k); if (!cur && k === '0') return; }
  if (next > MAX_AMOUNT) { toast('한 번에 입력할 수 있는 최대 금액이에요'); return; }
  setTransferAmount(next);
  updateAmountUI(e);
}

/* ---------- 송금 처리 ---------- */
let processingActive = false;
function pickRecipient(key) {
  const r = findRecipient(key);
  if (!r || navLock) return;
  Object.assign(appState.transfer, { recipientBank: r.bankId, recipientAccount: r.account, recipientName: r.name, recipientNameSource: 'manual', amount: 0, txId: null });
  saveAppState();
  navigateTo('amount');
}
// 별도 확인 화면 없이 금액 화면 위에 간단한 확인창만 띄운다
function openConfirmSheet() {
  const t = appState.transfer;
  if (sheets.length || processingActive) return;
  const v = validateTransfer('all');
  if (!v.ok) { toast(v.message); return; }
  if (!setTransferStatus('confirm')) return;
  if (!t.txId || appState.processedTxIds.includes(t.txId)) t.txId = genTxId();
  setTransferStatus('authorizing');
  saveAppState();
  const bank = bankById(t.recipientBank), acc = getAccount(t.sourceAccountId);
  openSheet({
    title: `<b>${esc(t.recipientName)}</b>님께<br><span class="num" style="color:var(--primary)">${won(t.amount)}</span>을 보낼까요?`,
    body: `<dl class="info-list confirm-mini">

        <div class="info-row"><dt>출금 계좌</dt><dd>${esc(acc.nickname)}</dd></div>
        <div class="info-row"><dt>보낸 후 잔액</dt><dd class="num">${won(acc.balance - t.amount)}</dd></div>
      </dl>
      `,
    foot: `<div class="btn-row"><button class="btn btn-gray" data-act="sheetClose">취소</button><button class="btn btn-primary" id="sendGo">보내기</button></div>`,
    onClose(reason) {
      if (reason !== 'continue' && appState.transfer.status === 'authorizing') { setTransferStatus('confirm'); setTransferStatus('amount'); saveAppState(); }
    },
    onMount(sh, api) {
      const go = sh.querySelector('#sendGo');
      go.addEventListener('click', () => {
        if (go.disabled || api.closed) return;
        go.disabled = true;
        api.close('continue');
        processDemoTransfer();
      });
    },
  });
}
function processDemoTransfer() {
  const t = appState.transfer;
  if (t.status !== 'authorizing' || processingActive) return;
  const v = validateTransfer('all');
  if (!v.ok) { setTransferStatus('confirm'); setTransferStatus('amount'); saveAppState(); toast(v.message); return; }
  processingActive = true;
  if (!navigateTo('processing', { txId: t.txId }, { force: true })) { processingActive = false; setTransferStatus('confirm'); setTransferStatus('amount'); }
}
function runProcessingAnimation(e) {
  setTimeout(() => {
    if (e.el.isConnected && appState.transfer.status === 'processing') completeDemoTransfer(e.params.txId);
  }, 1900);
}
function completeDemoTransfer(txId) {
  processingActive = false;
  const t = appState.transfer;
  // 이미 처리된 거래번호면 잔액을 다시 차감하지 않고 결과만 보여준다
  if (appState.processedTxIds.includes(txId)) { navigateTo('complete', { txId }, { replaceAll: true, force: true }); return false; }
  if (t.status !== 'processing' || t.txId !== txId) { console.warn('[토스] 처리 상태가 맞지 않아 무시합니다'); return false; }
  const acc = getAccount(t.sourceAccountId), bank = bankById(t.recipientBank);
  if (!acc || !bank || !Number.isSafeInteger(t.amount) || t.amount <= 0 || t.amount > acc.balance) {
    setTransferStatus('confirm');
    setTransferStatus('amount');
    saveAppState();
    stack.pop().el.remove();
    const prev = stack[stack.length - 1];
    if (prev) { prev.el.classList.remove('under'); prev.el.inert = false; paint(prev); }
    syncCurrent();
    toast('잔액이 부족해 송금을 진행하지 못했어요');
    return false;
  }
  const now = Date.now();
  acc.balance -= t.amount;
  const tx = {
    id: txId, accountId: acc.id, type: 'demo_transfer', direction: 'out',
    recipientName: t.recipientName, recipientNameSource: t.recipientNameSource,
    bankId: bank.id, bankName: bank.name, recipientAccount: t.recipientAccount,
    amount: t.amount, fee: 0, balanceAfter: acc.balance, createdAt: now, status: 'simulated',
  };
  appState.transactions.unshift(tx);
  appState.processedTxIds.push(txId);
  upsertRecipient(tx);
  setTransferStatus('completed');
  saveAppState(); // 잔액·거래내역·최근 수취인을 한 번에 저장
  navigateTo('complete', { txId }, { replaceAll: true, force: true });
  return true;
}
function leaveComplete() {
  resetTransfer();
  navigateTo('recipient', { root: true }, { replaceAll: true, force: true });
}

  sheetClose: el => { const s = sheetOf(el); s && s.close('cancel'); },
  appMenu: () => openSheet({
    title: '내 계좌', sub: '계좌를 누르면 잔액을 수정할 수 있어요.', flush: true,

      <button class="opt-row row-tap" data-act="about">${ICON.info}앱 정보</button>
      <button class="opt-row row-tap danger" data-act="resetData">${ICON.reset}앱 데이터 초기화</button>`,
  }),
  editBalance: el => {
    const acc = getAccount(el.dataset.id);
    if (!acc) return;
    ACTIONS.sheetClose(el);
    openSheet({
      title: `${esc(acc.nickname)} 잔액 수정`, sub: '잔액이에요. 송금은 이 금액 안에서만 할 수 있어요.',
      body: `<div class="input-box"><input id="balInput" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="done" aria-label="잔액" value="${comma(acc.balance)}"><span style="font-size:22px;font-weight:600">원</span></div>
        <div class="input-meta"><span class="err" id="balErr"></span><span id="balKo"></span></div>`,
      foot: `<div class="btn-row"><button class="btn btn-gray" data-act="sheetClose">취소</button><button class="btn btn-primary" id="balSave">저장</button></div>`,
      onMount(sh, api) {
        const inp = sh.querySelector('#balInput'), err = sh.querySelector('#balErr'), ko = sh.querySelector('#balKo'), save = sh.querySelector('#balSave');
        const read = () => Number(inp.value.replace(/\D/g, '') || 0);
        const sync = () => {
          let n = read();
          err.textContent = n > MAX_AMOUNT ? `최대 ${won(MAX_AMOUNT)}까지 입력할 수 있어요` : '';
          n = Math.min(n, MAX_AMOUNT);
          inp.value = inp.value.replace(/\D/g, '') ? comma(n) : '';
          ko.textContent = n ? koreanAmount(n) : '0원';
        };
        const doSave = () => {
          if (api.closed) return;
          acc.balance = Math.min(read(), MAX_AMOUNT);
          saveAppState();
          api.close('save');
          repaintTop();
          toast(`${acc.nickname} 잔액을 ${won(acc.balance)}으로 바꿨어요`);
        };
        inp.addEventListener('input', sync);
        inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); doSave(); } });
        save.addEventListener('click', doSave);
        sync();
        inp.focus({ preventScroll: true });
        inp.select();
      },
    });
  },
  about: el => { ACTIONS.sheetClose(el); infoSheet('앱 정보', '토스<br>입력한 정보와 거래내역은 이 기기의 브라우저에 저장돼요.'); },
  resetData: el => { ACTIONS.sheetClose(el); confirmSheet({ title: '앱 데이터를 초기화할까요?', sub: '잔액, 거래내역, 최근 보낸 계좌, 즐겨찾기가 모두 처음 상태로 돌아가요.', ok: '초기화', danger: true, onOk: resetAppData }); },
  /* 송금 흐름 */
  recipMode: el => { const top = stack[stack.length - 1]; if (top && top.name === 'recipient') { top.params.mode = el.dataset.mode; paint(top, false); } },
  clearDraft: () => {
    const t = appState.transfer;
    Object.assign(t, { recipientBank: null, recipientAccount: '', recipientName: '', amount: 0, txId: null });
    saveAppState();
    repaintTop('recipient');
  },
  openBank: () => openBankSelector(() => {
    const top = stack[stack.length - 1];
    if (!top) return;
    paint(top);
    const inp = top.el.querySelector('#acctInput');
    if (inp && !appState.transfer.recipientAccount && window.matchMedia('(pointer:fine)').matches) inp.focus();
  }),
  clearAcct: () => {
    const top = stack[stack.length - 1];
    setRecipientAccount('');
    const inp = top.el.querySelector('#acctInput');
    inp.value = '';
    top.el.querySelector('[data-act=clearAcct]').classList.add('hidden');
    top.el.querySelector('#acctMsg').textContent = '';
    updateRecipientCTA(top);
    inp.focus();
  },
  openName: () => openNameSheet(() => { repaintTop('recipient'); toast('받는 사람 이름을 저장했어요'); }),
  recipientNext: el => {
    const top = stack[stack.length - 1];
    const v = validateTransfer('recipient');
    if (!v.ok) {
      if (v.field === 'name') {
        const b = top.el.querySelector('#nameBtn');
        b.classList.remove('attn'); void b.offsetWidth; b.classList.add('attn');
        toast(v.message);
        setTimeout(() => openNameSheet(() => repaintTop('recipient')), 180);
      } else if (v.field === 'bank') {
        toast(v.message);
        openBankSelector(() => repaintTop('recipient'));
      } else {
        const m = top.el.querySelector('#acctMsg');
        m.className = 'field-msg';
        m.textContent = v.message;
        top.el.querySelector('#acctInput').focus();
      }
      return;
    }
    if (document.activeElement) document.activeElement.blur();
    appState.transfer.txId = null;
    navigateTo('amount');
  },
  pickRecipient: el => pickRecipient(el.dataset.key),
  toggleFav: el => {
    const r = findRecipient(el.dataset.key);
    if (!r) return;
    r.favorite = !r.favorite;
    saveAppState();
    toast(r.favorite ? '즐겨찾기에 추가했어요' : '즐겨찾기에서 삭제했어요');
    repaintTop();
  },
  recipMore: el => {
    const r = findRecipient(el.dataset.key);
    if (!r) return;
    openSheet({
      title: esc(r.name), sub: `${esc(bankById(r.bankId).name)} ${maskAccount(r.account)}`, flush: true,
      body: `<button class="opt-row row-tap" data-role="fav">${ICON.star}${r.favorite ? '즐겨찾기 해제' : '즐겨찾기 등록'}</button><button class="opt-row row-tap danger" data-role="del">${ICON.trash}최근 목록에서 삭제</button>`,
      onMount(sh, api) {
        sh.querySelector('[data-role=fav]').addEventListener('click', () => { api.close('ok'); ACTIONS.toggleFav(el); });
        sh.querySelector('[data-role=del]').addEventListener('click', () => {
          api.close('ok');
          appState.recipients = appState.recipients.filter(x => x.key !== r.key);
          saveAppState();
          toast('최근 목록에서 삭제했어요');
          repaintTop();
        });
      },
    });
  },
  chooseSource: () => openSourceSheet(() => {
    const top = stack[stack.length - 1];
    if (top && top.name === 'amount') paint(top);
  }),
  key: el => { const top = stack[stack.length - 1]; if (top && top.name === 'amount') pressKey(el.dataset.k, top); },
  quick: el => {
    const top = stack[stack.length - 1];
    const next = appState.transfer.amount + Number(el.dataset.v);
    if (next > MAX_AMOUNT) return toast('한 번에 입력할 수 있는 최대 금액이에요');
    setTransferAmount(next); updateAmountUI(top);
  },
  quickAll: () => { const top = stack[stack.length - 1], acc = getAccount(appState.transfer.sourceAccountId); setTransferAmount(acc ? acc.balance : 0); updateAmountUI(top); },
  amtClear: () => { const top = stack[stack.length - 1]; setTransferAmount(0); updateAmountUI(top, false); },
  amountNext: () => {
    const v = validateTransfer('all');
    if (!v.ok) {
      const top = stack[stack.length - 1], val = top.el.querySelector('#amtValue');
      val.classList.remove('shake'); void val.offsetWidth; val.classList.add('shake');
      toast(v.field === 'amount' && appState.transfer.amount === 0 ? '0원은 보낼 수 없어요' : v.message);
      return;
    }
    openConfirmSheet();
  },
  done: () => leaveComplete(),
};
/* ---------- 전역 이벤트 ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { ev.stopPropagation(); fn(el, ev); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { goBack(); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role=button][data-act]')) { ev.preventDefault(); ev.target.click(); }
  // PC에서 금액 화면 숫자 키 입력 지원
  const top = stack[stack.length - 1];
  if (top && top.name === 'amount' && !sheets.length && !ev.metaKey && !ev.ctrlKey) {
    if (/^[0-9]$/.test(ev.key)) pressKey(ev.key, top);
    else if (ev.key === 'Backspace') pressKey('del', top);
    else if (ev.key === 'Enter' && ev.target === document.body) ACTIONS.amountNext();
  }
});
document.addEventListener('touchstart', () => {}, { passive: true }); // iOS :active 활성화
// iOS 키보드가 올라올 때 바텀시트가 가려지지 않도록 보정
if (window.visualViewport) {
  const vv = window.visualViewport;
  const fit = () => {
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    $('#sheetLayer').style.setProperty('--kb', `${kb > 80 ? kb : 0}px`);
  };
  vv.addEventListener('resize', fit);
  vv.addEventListener('scroll', fit);
}
// 다른 탭에서 데이터가 바뀌면 송금 시작 화면에 있을 때만 다시 불러온다
window.addEventListener('storage', ev => {
  if (ev.key === STORAGE_KEY && stack.length === 1 && !sheets.length) { loadAppState(); appState.transfer.status = 'recipient'; repaintTop('recipient'); }
});

/* ---------- 시작 ---------- */
function init() {
  const status = loadAppState();
  navigateTo('recipient', { root: true }, { replaceAll: true, force: true });
  if (status === 'corrupt') setTimeout(() => toast('저장된 데이터에 문제가 있어 처음 상태로 복구했어요', 3200), 300);
}
init();
</script>
</body>
</html>
